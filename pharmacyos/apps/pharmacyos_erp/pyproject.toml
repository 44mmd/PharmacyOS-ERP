[project]
name = "pharmacyos_erp"
authors = [
    { name = "HALF" }
]
description = "PharmacyOS ERP — Pharmacy Operating System, built on ERPNext and the Frappe Framework"
requires-python = ">=3.14"
readme = "README.md"
license = { file = "license.txt" }
dynamic = ["version"]
dependencies = [
    # frappe and erpnext are installed and managed by bench.
]

[project.optional-dependencies]
# the automated tests only: `uv pip install -e "apps/pharmacyos_erp[test]"` (dev/setup-dev-bench.sh does)
test = [
    "freezegun~=1.5",  # Frappe's freeze_time test helper (Frappe lists it as a dev dependency only)
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=17.0.0-dev,<18.0.0"
erpnext = ">=17.0.0-dev,<18.0.0"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
    "B017", "B018", "B023", "B904", "E101", "E402", "E501", "E741",
    "F401", "F403", "F405", "F722", "W191",
    "UP030", "UP031", "UP032", "UP037", "UP040",
    "RUF001", "RUF002", "RUF003", # ambiguous unicode: Arabic text is intentional
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
