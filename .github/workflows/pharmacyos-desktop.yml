# PharmacyOS ERP — Windows desktop installer (PharmacyOS-ERP-Setup-<version>.exe).
# Manual / tag-triggered only, so it never runs on ordinary ERPNext pushes.
name: PharmacyOS Desktop (Windows)

on:
  workflow_dispatch:
  push:
    tags: ["pharmacyos-desktop-v*"]
    # PharmacyOS feature branches, only when the desktop app or this workflow changes
    branches: ["claude/**"]
    paths:
      - "pharmacyos/desktop/**"
      - ".github/workflows/pharmacyos-desktop.yml"

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pharmacyos/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: PharmacyOS-ERP-Setup
          path: pharmacyos/desktop/dist/*.exe
          if-no-files-found: error
